name: Build yellowsn0w IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build iOS app
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project from project.yml
        run: xcodegen generate --spec project.yml

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail

          xcodebuild \
            -project yellowsn0w.xcodeproj \
            -scheme yellowsn0w \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          APP_PATH="$GITHUB_WORKSPACE/build/DerivedData/Build/Products/Release-iphoneos/yellowsn0w.app"

          test -d "$APP_PATH"

          mkdir -p "$GITHUB_WORKSPACE/build/ipa/Payload"

          cp -R "$APP_PATH" \
            "$GITHUB_WORKSPACE/build/ipa/Payload/yellowsn0w.app"

          cd "$GITHUB_WORKSPACE/build/ipa"

          /usr/bin/zip -qry \
            "$GITHUB_WORKSPACE/build/yellowsn0w-unsigned.ipa" \
            Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: yellowsn0w-unsigned-ipa
          path: build/yellowsn0w-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
